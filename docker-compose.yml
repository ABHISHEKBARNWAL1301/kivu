# Optional Postgres for kivu (the default is SQLite, no setup needed).
# To use it, set KIVU_DATABASE_URL in .env.
# Start it with `docker compose up -d`. Credentials come from .env (copy .env.example).
# Listens on 5433 so it doesn't clash with another Postgres on 5432.
services:
  postgres:
    image: postgres:17
    container_name: kivu_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - kivu_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  kivu_pg:
