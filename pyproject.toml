[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kivu-agent"
version = "0.0.0.1"
description = "A bring-your-own-key terminal coding agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.56,<3",
]

[project.scripts]
kivu = "kivu.cli:main"

[tool.setuptools.packages.find]
include = ["kivu*"]
