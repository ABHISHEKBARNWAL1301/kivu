[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kivu-agent"
version = "2.0.0.dev0"
description = "A bring-your-own-key terminal coding agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
kivu = "kivu.cli:main"

[tool.setuptools.packages.find]
include = ["kivu*"]
