[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kivu-agent"
version = "0.1.0"
description = "A small Gemini-powered terminal agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.56,<3",
    "rich>=13.9,<15",
]

[project.scripts]
kivu = "kivu.cli:main"

[tool.setuptools.packages.find]
include = ["kivu*"]

